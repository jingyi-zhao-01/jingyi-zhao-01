name: Update Coding Activity Dashboard

on:
  schedule:
    - cron: '15 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate dashboard assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DASHBOARD_USERNAME: jingyi-zhao-01
        run: python scripts/generate_dashboard.py

      - name: Commit updated dashboard assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/loc-trend.svg assets/language-breakdown.svg data/dashboard.json
          if git diff --cached --quiet; then
            echo "No dashboard changes to commit"
            exit 0
          fi
          git commit -m "chore: update coding activity dashboard"
          git push
